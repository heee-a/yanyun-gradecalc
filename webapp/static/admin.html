<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流派数据导入 · 管理</title>
<style>
body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #0f1420;
       color: #e8ecf5; max-width: 640px; margin: 40px auto; padding: 0 16px; }
h1 { font-size: 18px; }
.card { background: #171e2e; border: 1px solid #2a3450; border-radius: 12px;
        padding: 16px; margin-bottom: 16px; }
input[type="password"], input[type="file"] { width: 100%; margin: 6px 0 12px;
  color: #e8ecf5; }
button { background: #5b8cff; color: white; border: 0; border-radius: 8px;
         padding: 9px 18px; font-size: 14px; cursor: pointer; }
pre { background: #0b0f18; padding: 10px; border-radius: 8px; white-space: pre-wrap;
      font-size: 12.5px; }
.muted { color: #93a0b8; font-size: 13px; }
a { color: #5b8cff; }
</style>
</head>
<body>
<h1>流派数据导入（管理员）</h1>
<div class="card">
  <label>管理令牌（环境变量 ADMIN_TOKEN）</label>
  <input id="token" type="password" placeholder="ADMIN_TOKEN">
  <label>上传毕业率计算器 .xlsx（可多选）</label>
  <input id="files" type="file" accept=".xlsx" multiple>
  <button onclick="doImport()">导入</button>
  <pre id="out">导入结果将显示在这里。</pre>
</div>
<p class="muted">导入会把计算器 xlsx 转成流派权重数据（服务端 builds/ 目录），
所有用户的「流派」下拉框随之下拉更新。权重数值可编辑源 JSON 后由管理员调整。</p>
<p class="muted"><a href="/">← 返回计算器</a></p>

<script>
async function doImport() {
  const token = document.getElementById("token").value;
  const files = document.getElementById("files").files;
  const out = document.getElementById("out");
  if (!files.length) { out.textContent = "请先选择 xlsx 文件"; return; }
  const form = new FormData();
  for (const f of files) form.append("files", f);
  out.textContent = "导入中…";
  try {
    const resp = await fetch("/api/admin/import-builds", {
      method: "POST",
      headers: { "X-Admin-Token": token },
      body: form,
    });
    const data = await resp.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = "导入失败：" + e.message;
  }
}
</script>
</body>
</html>
