<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>燕云装备毕业度计算器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>⚔️ 燕云装备毕业度计算器</h1>
  <div class="build-row">
    <label>流派</label>
    <select id="buildSelect"></select>
    <button id="btnRefreshMeta" class="ghost" title="重新拉取流派/满值数据">↻</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main>
  <!-- 方案管理 -->
  <section class="card">
    <div class="plan-row">
      <div id="planChips" class="chips"></div>
      <button id="btnNewPlan" class="primary">＋ 新方案</button>
    </div>
    <div class="plan-row" id="planActions" style="display:none">
      <input id="planName" type="text" maxlength="30" placeholder="方案名称">
      <button id="btnRename" class="ghost">重命名</button>
      <button id="btnDeletePlan" class="danger">删除方案</button>
    </div>
  </section>

  <!-- 添加装备 -->
  <section class="card">
    <h2>添加装备</h2>
    <div class="add-row">
      <label class="btn primary">📷 拍照识别
        <input id="fileCamera" type="file" accept="image/*" capture="environment" multiple hidden>
      </label>
      <label class="btn">🖼 从相册选择
        <input id="fileAlbum" type="file" accept="image/*" multiple hidden>
      </label>
      <span id="ocrStatus" class="muted"></span>
    </div>
    <p class="muted small">拍清楚装备词条区域即可，支持斜拍自动校正；识别结果可手动修正。
       照片仅用于本次识别，不在服务器保存；方案数据保存在你自己的浏览器中。</p>
  </section>

  <!-- 毕业度汇总 -->
  <section class="card" id="summaryCard" style="display:none">
    <div class="score-head">
      <div>
        <div class="score-label">方案毕业度</div>
        <div class="score-big"><span id="planScore">--</span><span class="grade" id="planGrade"></span></div>
      </div>
      <div class="muted small" id="pieceCount"></div>
    </div>
    <div class="score-head sub">
      <div class="muted small">逐件毕业度</div>
      <div id="pieceScores" class="chips small"></div>
    </div>
  </section>

  <!-- 装备卡片列表 -->
  <div id="pieces"></div>

  <section class="card muted small">
    满值表与流派权重由服务端提供，管理员可在
    <a href="/static/admin.html">导入页</a> 更新新的计算器 Excel。
    数据保存在本地浏览器（localStorage），清除浏览器数据会删除全部方案，重要方案请先导出备份。
    <button id="btnExport" class="ghost small">导出备份</button>
    <label class="btn ghost small">导入备份<input id="fileImport" type="file" accept=".json" hidden></label>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
