<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>燕云毕业度计算器 · 整套</title>
<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --ink: #171e2b;
    --sub: #64748b;
    --line: #e5e9f0;
    --accent: #4263eb;
    --accent-soft: #e8edfd;
    --ok: #0f8a4f;
    --ok-soft: #e6f7ef;
    --warn: #d97706;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(23,30,43,.05), 0 4px 14px rgba(23,30,43,.05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 14px 16px;
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .5px; }
  header span { color: var(--sub); font-size: 12px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 70px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--sub); font-weight: 600; letter-spacing: .5px; }
  .upload {
    display: block; text-align: center; padding: 22px 12px; cursor: pointer;
    border: 2px dashed #c6cfdd; border-radius: 14px; color: var(--sub); font-size: 17px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .upload:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .upload:active { transform: scale(.995); }
  .upload.small { padding: 11px 8px; font-size: 13.5px; border-radius: 10px; }
  input[type=file] { display: none; }
  .frow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .frow label { color: var(--sub); font-size: 14px; }
  input.f, select.f {
    width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: #fbfcfe; color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  input.f:focus, select.f:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: #fff;
  }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (min-width: 760px) { .slots { grid-template-columns: repeat(4, 1fr); } }
  .slot {
    border: 1px solid var(--line); border-radius: 14px; padding: 11px; background: #fbfcfe;
    transition: border-color .15s, background .15s;
  }
  .slot.done { border-color: #b6d4c3; background: #f7fcf9; }
  .slot h3 { margin: 0 0 8px; font-size: 14.5px; display: flex; justify-content: space-between; align-items: baseline; }
  .slot h3 .dim { color: var(--sub); font-size: 12px; font-weight: 400; }
  .slot h3 .ok { color: var(--ok); font-size: 12px; font-weight: 600; }
  .sub { display: grid; grid-template-columns: 22px 1fr 84px 20px; gap: 5px; align-items: center;
         padding: 4px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
  .sub:last-child { border-bottom: none; }
  .sub input[type=number] { width: 100%; font-size: 13.5px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .sub input[type=number]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sub input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .sub .nm { word-break: break-all; }
  .sub.off { opacity: .4; }
  .sub .tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 999px;
              background: var(--accent-soft); color: var(--accent); margin-right: 3px; vertical-align: 1px; }
  .sub .tag.rec { background: #fff2dc; color: var(--warn); }
  .sub .tag.dy { background: #f3e8ff; color: #7048e8; }
  .sub .tag.base { background: #fff2dc; color: var(--warn); }
  .sub select { width: 100%; font-size: 13.5px; padding: 6px 7px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .mainpick { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
  .mainpick label { color: var(--warn); font-size: 12.5px; font-weight: 600; }
  .del { border: none; background: none; color: #adb5bd; font-size: 15px; cursor: pointer; padding: 2px; border-radius: 6px; }
  .del:hover { color: var(--danger); background: #feeaea; }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 10px; line-height: 1.6; }
  button.primary {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 4px 12px rgba(66,99,235,.25); transition: background .15s, transform .1s;
  }
  button.primary:hover { background: #3655c9; }
  button.primary:active { transform: scale(.99); }
  button.primary:disabled { opacity: .55; cursor: wait; }
  .score { display: flex; align-items: center; gap: 18px; }
  .score .big { font-size: 50px; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }
  .grade { font-size: 15px; padding: 4px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .grade.g3 { background: var(--ok-soft); color: var(--ok); }
  .grade.g1 { background: #feeaea; color: var(--danger); }
  .dpsline { color: var(--sub); font-size: 13.5px; margin-top: 8px; }
  .dpsline b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .ver { color: #94a3b8; font-size: 12px; margin-top: 6px; }
  .panel-tbl { width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 8px; }
  .panel-tbl tr:nth-child(odd) { background: #f8fafc; }
  .panel-tbl td { border-top: 1px solid var(--line); padding: 5px 8px; }
  .panel-tbl td:last-child { text-align: right; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(6px);
    background: #171e2b; color: #fff; padding: 11px 20px; border-radius: 12px;
    font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; z-index: 50;
    box-shadow: 0 8px 24px rgba(23,30,43,.3);
  }
  .toast.show { opacity: .97; transform: translateX(-50%) translateY(0); }
  .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor;
    border-top-color: transparent; border-radius: 50%; animation: r 1s linear infinite; vertical-align: -3px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .prog { color: var(--accent); font-weight: 600; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header><h1>燕云毕业度计算器</h1><span>整套 8 件 · 站点同源引擎 · 本地 OCR</span></header>
<main>
  <div class="card">
    <h2>配置（与游戏内一致）</h2>
    <div class="frow"><label>流派</label><select class="f" id="flowSel"></select></div>
    <div class="frow"><label>心法</label><div id="xinfaSlots" style="display:grid; gap:8px"></div></div>
    <div class="frow"><label>套装</label><select class="f" id="setName"></select></div>
    <div class="frow"><label>弓决</label>
      <select class="f" id="bowSel">
        <option value="precision">精准</option>
        <option value="crit">会心</option>
        <option value="intent">会意</option>
      </select></div>
    <div class="frow"><label>武库</label>
      <select class="f" id="armorySel"><option value="本系">本系</option><option value="通用">通用</option></select></div>
    <div class="hint">心法槽位规则来自管理器站点：固定槽不可改，可选槽按下拉更换。</div>
  </div>

  <div class="card">
    <h2>装备照片（识别后可修改）<span class="prog" id="prog"></span></h2>
    <label class="upload" id="batchPick">📷 一次选择多张装备照片（每部位一张）
      <input type="file" id="batchFile" accept="image/*" multiple>
    </label>
    <div class="slots" id="slotGrid"></div>
    <div class="hint">也可以单独重拍某一格。识别会自动按部位（冠胄/胸甲/胫甲/腕甲/环/佩/武器）分配到对应格。</div>
  </div>

  <div class="card">
    <button class="primary" id="calcBtn">🧮 计算整套毕业率（网站同款引擎）</button>
    <div class="err" id="gradErr"></div>
    <div id="gradOut" class="hidden">
      <div class="score" style="margin-top:12px">
        <span class="big" id="gradNum">—</span>
        <span class="grade" id="gradGrade"></span>
      </div>
      <div class="dpsline" id="gradDps"></div>
      <div class="ver" id="gradVersion"></div>
      <table class="panel-tbl" id="panelTbl"></table>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const SLOT_LABELS = {
  weapon1: "武器1", weapon2: "武器2", head: "冠胄", chest: "胸甲",
  ring: "环", pendant: "佩", legs: "胫甲", hands: "腕甲",
};
const state = { engine: null, flow: "", xinfa: [], slots: {}, busy: false };
let uidSeq = 1;
const newUid = () => "r" + uidSeq++;
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function toast(msg, ms = 2800) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- 引擎元数据：流派 / 心法槽位 / 套装 ---------- */
async function loadEngineMeta() {
  try {
    const r = await fetch("/api/engine");
    const d = await r.json();
    if (!d.available) throw new Error(d.error || "引擎不可用");
    state.engine = d;
    const sel = $("flowSel");
    sel.innerHTML = "";
    for (const f of d.flowNames) {
      const o = document.createElement("option");
      o.value = f; o.textContent = f;
      const rot = (d.classRotationStats || {})[f];
      if (rot && rot.version) o.textContent += `（${rot.version.replace("110阶竞速轴属性毕业率进阶计算器", " ")}）`;
      sel.appendChild(o);
    }
    sel.onchange = () => { state.flow = sel.value; renderXinfa(); };
    state.flow = sel.value || "";
    renderSets();
    renderXinfa();
  } catch (e) {
    toast("引擎不可用：" + e.message + "（需安装 Node.js，并在仓库根目录运行）", 5000);
  }
}

function renderSets() {
  const sel = $("setName"); sel.innerHTML = "";
  const empty = document.createElement("option");
  empty.value = ""; empty.textContent = "（不指定套装）";
  sel.appendChild(empty);
  for (const nm of state.engine.setNames || []) {
    const o = document.createElement("option");
    o.value = nm; o.textContent = nm;
    const bonus = (state.engine.setData || {})[nm];
    if (bonus && Object.keys(bonus).length)
      o.textContent += `（主词条 ${Object.entries(bonus).map(([k, v]) => k + "+" + v).join("、")}）`;
    sel.appendChild(o);
  }
}

function renderXinfa() {
  const rule = (state.engine.xinfa || {})[state.flow] || { default: ["", "", "", ""], choices: [[], [], [], []] };
  state.xinfa = [...rule.default];
  const box = $("xinfaSlots"); box.innerHTML = "";
  rule.default.forEach((name, i) => {
    const cands = [...new Set(rule.choices[i] || [])];
    const locked = cands.length === 0;
    const row = document.createElement("div");
    row.className = "frow"; row.style.margin = "0";
    if (locked) {
      row.innerHTML = `<label>槽${i + 1}（固定）</label>` +
        `<div class="f" style="padding:8px 12px;background:#f1f3f6;border-radius:9px">${esc(name || "—")}</div>`;
      box.appendChild(row);
    } else {
      const opts = cands.map(c => `<option value="${c}" ${c === name ? "selected" : ""}>${esc(c)}</option>`).join("");
      row.innerHTML = `<label>槽${i + 1}</label><select class="f">${opts}</select>`;
      row.querySelector("select").onchange = e => { state.xinfa[i] = e.target.value; };
      box.appendChild(row);
    }
  });
}

/* ---------- 部位格 ---------- */
function buildSlotGrid() {
  const g = $("slotGrid"); g.innerHTML = "";
  state.slots = {};
  for (const key in SLOT_LABELS) {
    const card = document.createElement("div");
    card.className = "slot"; card.id = "slot-" + key;
    card.innerHTML = `<h3><span>${SLOT_LABELS[key]}</span><span class="dim" id="sl-info-${key}">未识别</span></h3>` +
      `<label class="upload small" id="sl-up-${key}">📷 拍摄/选择<input type="file" accept="image/*" capture="environment"></label>` +
      `<div id="sl-body-${key}"></div>`;
    g.appendChild(card);
    const inp = card.querySelector("input");
    inp.onchange = () => { if (inp.files[0]) analyzeSlot(key, inp.files[0]); inp.value = ""; };
  }
}

function updateProg() {
  const n = Object.keys(state.slots).length;
  $("prog").textContent = n ? `已识别 ${n}/8` : "";
}

async function analyzeSlot(key, file) {
  const up = $("sl-up-" + key);
  up.innerHTML = '<span class="spin"></span> 识别中…';
  try {
    const d = await analyzeFile(file);
    fillSlot(key, d);
  } catch (e) {
    toast(key + " 识别失败：" + e.message);
  } finally {
    up.innerHTML = "📷 重拍/重选";
    updateProg();
  }
}

async function analyzeFile(file) {
  const fd = new FormData(); fd.append("image", file);
  const r = await fetch("/api/analyze", { method: "POST", body: fd });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "识别失败");
  return d;
}

function fillSlot(key, d) {
  const rows = [...d.base_stats.map(b => ({ ...b, isBase: true })),
                ...d.affixes.map(a => ({ ...a, isBase: false }))];
  rows.forEach(r => { r.uid = newUid(); r.include = true; });
  state.slots[key] = { piece: d.piece, rows, mainUid: pickMainUid(key, rows) };
  $("sl-info-" + key).innerHTML = '<span class="ok">✓ 已识别</span>';
  $("slot-" + key).classList.add("done");
  renderSlot(key);
}

function pickMainUid(key, rows) {
  const armor = ["head", "chest", "legs", "hands"].includes(key);
  const prefer = armor ? ["气血最大值"] : ["最大外功攻击", "最大鸣金攻击"];
  for (const nm of prefer) {
    const hit = rows.find(r => r.name === nm);
    if (hit) return hit.uid;
  }
  return rows.length ? rows[0].uid : null;
}

function renderSlot(key) {
  const s = state.slots[key];
  if (!s) return;
  const body = $("sl-body-" + key); body.innerHTML = "";
  const p = s.piece;
  const cap = document.createElement("div");
  cap.className = "dim"; cap.style.marginBottom = "6px";
  cap.textContent = [p.name, p.set_name, p.craft_score ? "造诣" + p.craft_score : ""].filter(Boolean).join(" · ");
  body.appendChild(cap);

  const mainRow = document.createElement("div");
  mainRow.className = "mainpick";
  const opts = s.rows.map(r =>
    `<option value="${r.uid}" ${r.uid === s.mainUid ? "selected" : ""}>${esc(r.name)} ${r.value}${r.unit === "percent" ? "%" : ""}</option>`).join("");
  mainRow.innerHTML = `<label>主词条</label><select>${opts || "<option>（无候选）</option>"}</select>`;
  const msel = mainRow.querySelector("select");
  msel.onchange = () => { s.mainUid = msel.value || null; renderSlot(key); };
  body.appendChild(mainRow);

  for (const r of s.rows) {
    if (r.uid === s.mainUid) continue;
    const div = document.createElement("div");
    div.className = "sub" + (r.include ? "" : " off");
    const tags = (r.converted ? '<span class="tag">转</span>' : "") +
                 (r.dingyin ? '<span class="tag dy">定音</span>' : "") +
                 (r.recommended ? '<span class="tag rec">荐</span>' : "") +
                 (r.known ? "" : '<span class="tag" style="background:#f1f3f5;color:#868e96">未识别</span>');
    div.innerHTML =
      `<input type="checkbox" ${r.include ? "checked" : ""}>` +
      `<div class="nm">${tags}${esc(r.name)}</div>` +
      `<div style="display:flex"><input type="number" step="0.1" value="${r.value}"><span class="unit">${r.unit === "percent" ? "%" : ""}</span></div>` +
      `<button class="del">✕</button>`;
    const [chk, , valBox, del] = div.children;
    const numIn = valBox.querySelector("input");
    chk.onchange = () => { r.include = chk.checked; renderSlot(key); };
    numIn.oninput = () => { const v = parseFloat(numIn.value); if (!isNaN(v)) r.value = v; };
    del.onclick = () => { s.rows = s.rows.filter(x => x !== r); if (s.mainUid === r.uid) s.mainUid = null; renderSlot(key); };
    body.appendChild(div);
  }
}

/* ---------- 批量上传：自动按部位分配 ---------- */
async function analyzeBatch(files) {
  const list = [...files];
  for (let i = 0; i < list.length; i++) {
    $("prog").textContent = `识别中 ${i + 1}/${list.length}…`;
    try {
      const d = await analyzeFile(list[i]);
      const slot = assignAuto(d.suggest, d);
      if (slot) toast(`${SLOT_LABELS[slot]} ✓ ${d.piece.name || ""}`, 1100);
    } catch (e) {
      toast("一张照片识别失败：" + e.message);
    }
  }
  $("prog").textContent = "";
  updateProg();
}

function assignAuto(suggest, d) {
  const target = suggest === "weapon"
    ? (!state.slots.weapon1 ? "weapon1" : !state.slots.weapon2 ? "weapon2" : "weapon1")
    : suggest;
  if (target && SLOT_LABELS[target]) {
    fillSlot(target, d);
    return target;
  }
  const free = Object.keys(SLOT_LABELS).find(k => !state.slots[k]);
  if (free) { fillSlot(free, d); return free; }
  toast("8 个部位已满，多余照片已忽略");
  return null;
}

/* ---------- 整套计算 ---------- */
$("calcBtn").onclick = async () => {
  const equipped = {};
  for (const key in state.slots) {
    const s = state.slots[key];
    if (!s) continue;
    const main = s.rows.find(r => r.uid === s.mainUid);
    if (!main) { toast(`${SLOT_LABELS[key]} 未选择主词条，已跳过`); continue; }
    equipped[key] = {
      mainStat: { type: main.name, value: main.value, isPercent: main.unit === "percent" },
      subStats: s.rows.filter(r => r.include && r.uid !== s.mainUid)
        .map(r => ({ type: r.name, value: r.value, isPercent: r.unit === "percent" })),
    };
  }
  if (!Object.keys(equipped).length) { toast("还没有识别任何装备"); return; }
  const btn = $("calcBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 引擎计算中…';
  $("gradErr").textContent = "";
  try {
    const r = await fetch("/api/gradrate", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        className: state.flow, bow: $("bowSel").value, armory: $("armorySel").value,
        setName: $("setName").value, xinfa: state.xinfa.slice(0, 4),
        equippedItems: equipped,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "计算失败");
    $("gradOut").classList.remove("hidden");
    const rate = parseFloat(d.graduationRate);
    $("gradNum").textContent = isNaN(rate) ? "—" : rate.toFixed(2) + "%";
    const g = rate >= 90 ? { g: "毕业", cls: "g3" } : rate >= 70 ? { g: "成长中", cls: "" } : { g: "还需打造", cls: "g1" };
    $("gradGrade").textContent = g.g;
    $("gradGrade").className = "grade " + g.cls;
    $("gradDps").innerHTML = `<span>DPS <b>${Math.round(d.dps || 0).toLocaleString()}</b></span>` +
      `<span>总伤 <b>${Math.round(d.totalDamage || 0).toLocaleString()}</b></span>` +
      `<span>心法 <b>${(d.xinfa || []).filter(Boolean).join(" / ")}</b></span>`;
    const v = d.meta && d.meta.version;
    $("gradVersion").textContent = v ? `基准：${v.version || ""}（${v.updateTime || ""}）` : "";
    const panel = d.panel || {};
    $("panelTbl").innerHTML = Object.entries(panel)
      .filter(([k, v]) => typeof v === "number" && !k.startsWith("_"))
      .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${Math.round(v * 1000) / 1000}</td></tr>`).join("");
  } catch (e) {
    $("gradErr").textContent = e.message;
  } finally {
    btn.disabled = false; btn.innerHTML = "🧮 计算整套毕业率（网站同款引擎）";
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
};

/* ---------- 批量文件选择 ---------- */
function bindBatch() {
  const f = $("batchFile");
  f.onchange = async () => {
    if (!f.files.length || state.busy) { f.value = ""; return; }
    state.busy = true;
    await analyzeBatch(f.files);
    state.busy = false;
    f.value = "";
  };
}

buildSlotGrid();
