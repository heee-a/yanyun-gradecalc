<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>燕云毕业度计算器</title>
<style>
  :root {
    --bg: #eef1f5;          /* 纯色背景 */
    --card: #ffffff;
    --ink: #1f2430;
    --sub: #6b7280;
    --line: #e3e7ee;
    --accent: #3b5bdb;
    --ok: #2b8a3e;
    --warn: #e8590c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--sub); font-size: 12px; }
  main { max-width: 720px; margin: 0 auto; padding: 14px 14px 60px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 14px;
  }
  .upload {
    display: block; text-align: center; padding: 26px 12px; cursor: pointer;
    border: 2px dashed #c3ccdb; border-radius: 14px; color: var(--sub); font-size: 17px;
  }
  .upload:active { background: #f6f8fb; }
  #file { display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .meta b { font-size: 18px; }
  .meta .dim { color: var(--sub); font-size: 13px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row {
    display: grid; grid-template-columns: 26px 1fr 96px 26px; gap: 8px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row input[type=number] {
    width: 100%; font-size: 16px; padding: 7px 8px; border: 1px solid var(--line);
    border-radius: 8px; background: #fafbfd; color: var(--ink);
  }
  .row .unit { color: var(--sub); font-size: 13px; margin-left: 2px; }
  .row .nm { word-break: break-all; font-size: 15px; }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px;
    background: #eef; color: var(--accent); margin-right: 4px; vertical-align: 1px;
  }
  .tag.rec { background: #fff4e6; color: var(--warn); }
  .roll { color: var(--sub); font-size: 13px; text-align: right; }
  .row.off .nm, .row.off .roll { opacity: .45; }
  .row.base { background: #fff8f0; border-radius: 8px; padding-left: 6px; padding-right: 6px; }
  .score { display: flex; align-items: center; gap: 16px; }
  .score .big { font-size: 42px; font-weight: 700; color: var(--accent); }
  .grade { font-size: 15px; padding: 3px 12px; border-radius: 999px; background: #e7f0ff; color: var(--accent); }
  .grade.g3 { background: #ebfbee; color: var(--ok); }
  .grade.g1 { background: #fff0f0; color: #c92a2a; }
  .others { color: var(--sub); font-size: 13px; margin-top: 8px; line-height: 1.7; }
  .del { border: none; background: none; color: #adb5bd; font-size: 18px; cursor: pointer; padding: 4px; }
  button.primary {
    width: 100%; padding: 13px; font-size: 16px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer; margin-top: 10px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: .95; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: r 1s linear infinite; vertical-align: -3px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 10px; }
  @media (min-width: 640px) { .row { grid-template-columns: 26px 1fr 120px 26px; } }
</style>
</head>
<body>
<header><h1>燕云毕业度计算器</h1><span>本地 OCR · 数据不出本机</span></header>
<main>
  <div class="card">
    <label class="upload" id="pick">📷 选择 / 拍摄装备照片
      <input type="file" id="file" accept="image/*" capture="environment">
    </label>
    <div class="hint">斜着拍屏幕也可以，会自动校正；只需拍清词条区域。</div>
  </div>

  <div class="card" id="pieceCard" style="display:none">
    <div class="meta">
      <b id="pName"></b>
      <span class="dim" id="pTier"></span>
      <span class="dim" id="pSet"></span>
      <span class="dim" id="pCraft"></span>
    </div>
  </div>

  <div class="card" id="buildCard" style="display:none">
    <div class="chips" id="chips"></div>
  </div>

  <div class="card" id="affixCard" style="display:none">
    <div id="rows"></div>
    <button class="primary" id="addRow">＋ 手动加一条词条</button>
  </div>

  <div class="card" id="scoreCard" style="display:none">
    <div class="score">
      <span class="big" id="scoreNum">—</span>
      <span class="grade" id="grade"></span>
    </div>
    <div class="others" id="others"></div>
    <div class="hint">毕业度 = 各词条（数值÷110阶满值，封顶100%）按流派权重加权平均；
      满值表在仓库 data/affix_max.json，欢迎校对补充。</div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const state = { affixes: [], builds: {}, maxTable: {}, sel: "__auto__" };
const $ = id => document.getElementById(id);

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}

function weightFor(name, weights) {
  if (name in weights) return weights[name];
  let best = null;
  for (const k in weights)
    if (k && (name.endsWith(k) || k.endsWith(name)))
      best = best === null ? weights[k] : Math.max(best, weights[k]);
  return best === null ? 0 : best;
}

function rollOf(a) {
  const mx = state.maxTable[a.name];
  if (!mx) return { roll: null, base: false };
  if (a.value > mx * 1.3) return { roll: null, base: true };
  return { roll: Math.min(100, a.value / mx * 100), base: false };
}

function computeFor(weights) {
  let num = 0, den = 0;
  for (const a of state.affixes) {
    if (!a.include) continue;
    const w = weightFor(a.name, weights);
    if (w <= 0) continue;
    const { roll, base } = rollOf(a);
    if (roll === null || base) continue;
    num += w * roll; den += w;
  }
  return den ? Math.round(num / den * 10) / 10 : null;
}

function gradeOf(s) {
  if (s === null) return { g: "—", cls: "" };
  if (s >= 90) return { g: "毕业", cls: "g3" };
  if (s >= 80) return { g: "准毕业", cls: "" };
  if (s >= 70) return { g: "可用", cls: "" };
  return { g: "过渡", cls: "g1" };
}

function render() {
  const has = state.affixes.length > 0;
  $("pieceCard").style.display = has ? "" : "none";
  $("buildCard").style.display = has ? "" : "none";
  $("affixCard").style.display = has ? "" : "none";
  $("scoreCard").style.display = has ? "" : "none";
  if (!has) return;

  const rows = $("rows"); rows.innerHTML = "";
  for (const a of state.affixes) {
    const w = state.sel === "__auto__" ? null : weightFor(a.name, state.builds[state.sel]);
    const { roll, base } = rollOf(a);
    const div = document.createElement("div");
    div.className = "row" + (a.include ? "" : " off") + (base ? " base" : "");
    const tags = (a.converted ? '<span class="tag">转</span>' : "") +
                 (a.recommended ? '<span class="tag rec">荐</span>' : "") +
                 (a.known ? "" : '<span class="tag" style="background:#f1f3f5;color:#868e96">未识别</span>');
    const weightTxt = base ? "基础属性·已排除"
      : (roll === null ? (a.include ? "缺满值" : "") : Math.round(roll) + "%");
    div.innerHTML =
      `<input type="checkbox" ${a.include ? "checked" : ""}>` +
      `<div class="nm">${tags}${a.name}` +
        `<div class="roll">${weightTxt}${w === null ? "" : " · 权重" + w}</div></div>` +
      `<div><input type="number" step="0.1" value="${a.value}"><span class="unit">${a.unit === "percent" ? "%" : ""}</span></div>` +
      `<button class="del" title="删除">✕</button>`;
    const [chk, , valBox, del] = div.children;
    const numIn = valBox.querySelector("input");
    chk.onchange = () => { a.include = chk.checked; render(); };
    numIn.oninput = () => { const v = parseFloat(numIn.value); if (!isNaN(v)) { a.value = v; refreshScoreOnly(); } };
    numIn.onblur = render;
    del.onclick = () => { state.affixes = state.affixes.filter(x => x !== a); render(); };
    rows.appendChild(div);
  }
  refreshScoreOnly();
}

function refreshScoreOnly() {
  if (state.sel === "__auto__") {
    let best = null, lines = [];
    for (const name in state.builds) {
      const s = computeFor(state.builds[name]);
      if (s !== null) lines.push([name, s]);
    }
    lines.sort((x, y) => y[1] - x[1]);
    if (lines.length) {
      best = lines[0];
      const g = gradeOf(best[1]);
      $("scoreNum").textContent = best[1].toFixed(1);
      $("grade").textContent = `${g.g} · 最适配：${best[0]}`;
      $("grade").className = "grade " + g.cls;
      $("others").innerHTML = "全部流派：" + lines.map(l => `${l[0]} <b>${l[1]}</b>`).join("　");
    } else { $("scoreNum").textContent = "—"; $("grade").textContent = "无法计算"; }
  } else {
    const s = computeFor(state.builds[state.sel]);
    const g = gradeOf(s);
    $("scoreNum").textContent = s === null ? "—" : s.toFixed(1);
    $("grade").textContent = g.g;
    $("grade").className = "grade " + g.cls;
    $("others").textContent = "";
  }
}

function renderChips() {
  const c = $("chips"); c.innerHTML = "";
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.className = "chip" + (state.sel === key ? " on" : "");
    b.textContent = label;
    b.onclick = () => { state.sel = key; renderChips(); render(); };
    c.appendChild(b);
  };
  mk("__auto__", "🎯 自动对比");
  for (const name of Object.keys(state.builds)) mk(name, name);
}

async function analyze(file) {
  const fd = new FormData(); fd.append("image", file);
  $("pick").innerHTML = '<span class="spin"></span> 正在本机识别…（约几秒）';
  try {
    const r = await fetch("/api/analyze", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "识别失败");
    const p = d.piece;
    $("pName").textContent = p.name || "（未识别装备名）";
    $("pTier").textContent = p.tier || "";
    $("pSet").textContent = p.set_name || "";
    $("pCraft").textContent = p.craft_score ? "造诣 " + p.craft_score : "";
    state.maxTable = d.max_table;
    state.builds = d.builds;
    state.affixes = d.affixes.map(a => ({ ...a, include: true }));
    if (!state.affixes.length) toast("没识别出词条，换个角度/亮度再拍一张试试");
    renderChips(); render();
  } catch (e) {
    toast(e.message.includes("Failed to fetch") ? "服务未启动，请先运行 python -m yanyun_gradecalc.web" : e.message, 4000);
  } finally {
    $("pick").innerHTML = '📷 选择 / 拍摄装备照片<input type="file" id="file" accept="image/*" capture="environment">';
    bindFile();
  }
}

let _fileBound = false;
function bindFile() {
  const f = $("file");
  if (!f || _fileBound) return;
  _fileBound = true;
  f.onchange = () => { if (f.files[0]) analyze(f.files[0]); f.value = ""; };
}
bindFile();

$("addRow").onclick = () => {
  state.affixes.push({ name: "自定义词条", raw_name: "", value: 0, unit: "percent",
                       converted: false, recommended: false, known: false, include: true });
  render();
  const inputs = document.querySelectorAll('#rows input[type=number]');
  inputs[inputs.length - 1].focus();
};

fetch("/api/config").then(r => r.json()).then(d => {
  state.builds = d.builds; state.maxTable = d.max_table; renderChips();
}).catch(() => toast("无法连接本地服务：请先运行 python -m yanyun_gradecalc.web", 5000));
</script>
</body>
</html>
