<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>燕云毕业度计算器</title>
<style>
  :root {
    --bg: #eef1f5;          /* 纯色背景 */
    --card: #ffffff;
    --ink: #1f2430;
    --sub: #6b7280;
    --line: #e3e7ee;
    --accent: #3b5bdb;
    --ok: #2b8a3e;
    --warn: #e8590c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 10px 16px 0;
  }
  header h1 { font-size: 18px; margin: 0 0 8px; }
  header h1 span { color: var(--sub); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 9px 18px; font-size: 15px; cursor: pointer; border: 1px solid var(--line);
    border-bottom: none; border-radius: 10px 10px 0 0; background: #e6eaef; color: var(--sub);
  }
  .tab.on { background: var(--card); color: var(--accent); font-weight: 600; }
  main { max-width: 780px; margin: 0 auto; padding: 14px 14px 70px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 14px;
  }
  .upload {
    display: block; text-align: center; padding: 24px 12px; cursor: pointer;
    border: 2px dashed #c3ccdb; border-radius: 14px; color: var(--sub); font-size: 17px;
  }
  .upload:active { background: #f6f8fb; }
  .upload.small { padding: 13px 8px; font-size: 14px; border-radius: 10px; }
  input[type=file] { display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .meta b { font-size: 18px; }
  .dim { color: var(--sub); font-size: 13px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row {
    display: grid; grid-template-columns: 26px 1fr 96px 26px; gap: 8px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row input[type=number], .row select, input.f, select.f {
    width: 100%; font-size: 16px; padding: 7px 8px; border: 1px solid var(--line);
    border-radius: 8px; background: #fafbfd; color: var(--ink);
  }
  select.f, input.f { padding: 9px 10px; }
  .unit { color: var(--sub); font-size: 13px; margin-left: 2px; }
  .nm { word-break: break-all; font-size: 15px; }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px;
    background: #eef; color: var(--accent); margin-right: 4px; vertical-align: 1px;
  }
  .tag.rec { background: #fff4e6; color: var(--warn); }
  .tag.dy { background: #f3e8ff; color: #7048e8; }
  .roll { color: var(--sub); font-size: 13px; text-align: right; }
  .row.off .nm, .row.off .roll { opacity: .45; }
  .row.base { background: #f6f9ff; border-radius: 8px; }
  .score { display: flex; align-items: center; gap: 16px; }
  .score .big { font-size: 46px; font-weight: 700; color: var(--accent); }
  .grade { font-size: 15px; padding: 3px 12px; border-radius: 999px; background: #e7f0ff; color: var(--accent); }
  .grade.g3 { background: #ebfbee; color: var(--ok); }
  .grade.g1 { background: #fff0f0; color: #c92a2a; }
  .others { color: var(--sub); font-size: 13px; margin-top: 8px; line-height: 1.7; }
  .del { border: none; background: none; color: #adb5bd; font-size: 18px; cursor: pointer; padding: 4px; }
  button.primary {
    width: 100%; padding: 13px; font-size: 16px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer; margin-top: 10px;
  }
  button.primary:disabled { opacity: .5; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
  .frow { display: grid; grid-template-columns: 84px 1fr; gap: 8px; align-items: center; margin-bottom: 9px; }
  .frow label { color: var(--sub); font-size: 14px; }
  .slot { border: 1px solid var(--line); border-radius: 12px; padding: 11px; margin-bottom: 12px; }
  .slot h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
  .slot h3 .dim { font-weight: 400; }
  .sub { display: grid; grid-template-columns: 22px 1fr 86px 22px; gap: 6px; align-items: center;
         padding: 5px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
  .sub:last-child { border-bottom: none; }
  .sub input[type=number] { width: 100%; font-size: 14px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; }
  .sub.off { opacity: .45; }
  .bigstat { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 6px; }
  .bigstat b { font-size: 20px; }
  .panel-tbl { width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 8px; }
  .panel-tbl td { border-top: 1px solid var(--line); padding: 4px 6px; }
  .panel-tbl td:last-child { text-align: right; color: var(--accent); font-weight: 600; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; z-index: 50;
  }
  .toast.show { opacity: .95; }
  .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor;
    border-top-color: transparent; border-radius: 50%; animation: r 1s linear infinite; vertical-align: -3px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>燕云毕业度计算器<span>本地 OCR · 数据不出本机</span></h1>
  <div class="tabs">
    <div class="tab on" data-tab="single" onclick="switchTab('single')">单件滚动评分</div>
    <div class="tab" data-tab="full" onclick="switchTab('full')">整套毕业率 · 网站引擎</div>
  </div>
</header>

<!-- ============ Tab 1：单件滚动评分 ============ -->
<main id="tab-single">
  <div class="card">
    <label class="upload" id="pick">📷 选择 / 拍摄装备照片
      <input type="file" id="file" accept="image/*" capture="environment">
    </label>
    <div class="hint">斜着拍屏幕也可以，会自动校正；只需拍清词条区域。</div>
  </div>

  <div class="card" id="pieceCard" style="display:none">
    <div class="meta">
      <b id="pName"></b>
      <span class="dim" id="pTier"></span>
      <span class="dim" id="pSet"></span>
      <span class="dim" id="pCraft"></span>
    </div>
  </div>

  <div class="card" id="buildCard" style="display:none"><div class="chips" id="chips"></div></div>

  <div class="card" id="affixCard" style="display:none">
    <div id="rows"></div>
    <button class="primary" id="addRow">＋ 手动加一条词条</button>
  </div>

  <div class="card" id="scoreCard" style="display:none">
    <div class="score">
      <span class="big" id="scoreNum">—</span>
      <span class="grade" id="grade"></span>
    </div>
    <div class="others" id="others"></div>
    <div class="hint">毕业度 = 各词条（数值÷110阶满值，封顶100%）按流派权重加权平均；
      满值表在仓库 data/affix_max.json，欢迎校对补充。</div>
  </div>
</main>

<!-- ============ Tab 2：整套毕业率（网站引擎） ============ -->
<main id="tab-full" class="hidden">
  <div class="card">
    <div class="frow"><label>流派</label><select class="f" id="flowSel"></select></div>
    <div class="frow"><label>心法（随流派变化）</label><div id="xinfaSlots" style="display:grid; gap:6px"></div></div>
    <div class="frow"><label>套装</label><select class="f" id="setName"></select></div>
    <div class="frow"><label>弓决</label>
      <select class="f" id="bowSel">
        <option value="precision">精准</option>
        <option value="crit">会心</option>
        <option value="intent">会意</option>
      </select></div>
    <div class="frow"><label>武库</label>
      <select class="f" id="armorySel"><option value="本系">本系</option><option value="通用">通用</option></select></div>
    <div class="hint">心法与套装请与游戏内配置一致；流派下拉来自管理器数据（含基准版本）。</div>
  </div>

  <div class="card">
    <div class="grid2" id="slotGrid"></div>
    <div class="hint">每个部位拍一张（拍清词条即可），识别后可改数值；主词条下拉可选基础属性行。</div>
  </div>

  <div class="card">
    <button class="primary" id="calcBtn">🧮 计算整套毕业率（网站同款引擎）</button>
    <div id="gradOut" style="display:none">
      <div class="score" style="margin-top:12px">
        <span class="big" id="gradNum">—</span>
        <span class="grade" id="gradGrade"></span>
      </div>
      <div class="bigstat" id="gradDps"></div>
      <div class="dim" id="gradVersion"></div>
      <details style="margin-top:8px"><summary class="dim">聚合面板（引擎输出）</summary>
        <table class="panel-tbl" id="panelTbl"></table></details>
    </div>
    <div id="gradErr" class="hint" style="color:#c92a2a"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const state = {
  affixes: [], builds: {}, maxTable: {}, sel: "__auto__",   // tab1
  engine: null,                                              // tab2
  flow: "", xinfa: [],   // 由引擎 meta 按流派填充（4 槽）
  slots: {},                                                 // tab2: slot -> {piece, affixes, baseStats, mainUid}
};
const SLOT_LABELS = {
  weapon1: "武器1", weapon2: "武器2", head: "冠胄", chest: "胸甲",
  ring: "环", pendant: "佩", legs: "胫甲", hands: "腕甲",
};
let uidSeq = 1;
const newUid = () => "r" + uidSeq++;

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  $("tab-single").classList.toggle("hidden", name !== "single");
  $("tab-full").classList.toggle("hidden", name !== "full");
  if (name === "full") loadEngineMeta();
}

/* ================= Tab 1：单件滚动评分 ================= */
function weightFor(name, weights) {
  if (name in weights) return weights[name];
  let best = null;
  for (const k in weights)
    if (k && (name.endsWith(k) || k.endsWith(name)))
      best = best === null ? weights[k] : Math.max(best, weights[k]);
  return best === null ? 0 : best;
}
function rollOf(a) {
  const mx = state.maxTable[a.name];
  if (!mx) return { roll: null, base: false };
  if (a.value > mx * 1.3) return { roll: null, base: true };
  return { roll: Math.min(100, a.value / mx * 100), base: false };
}
function computeFor(weights) {
  let num = 0, den = 0;
  for (const a of state.affixes) {
    if (!a.include) continue;
    const w = weightFor(a.name, weights);
    if (w <= 0) continue;
    const { roll, base } = rollOf(a);
    if (roll === null || base) continue;
    num += w * roll; den += w;
  }
  return den ? Math.round(num / den * 10) / 10 : null;
}
function gradeOf(s) {
  if (s === null) return { g: "—", cls: "" };
  if (s >= 90) return { g: "毕业", cls: "g3" };
  if (s >= 80) return { g: "准毕业", cls: "" };
  if (s >= 70) return { g: "可用", cls: "" };
  return { g: "过渡", cls: "g1" };
}
function render() {
  const has = state.affixes.length > 0;
  ["pieceCard", "buildCard", "affixCard", "scoreCard"].forEach(id =>
    $(id).style.display = has ? "" : "none");
  if (!has) return;
  const rows = $("rows"); rows.innerHTML = "";
  for (const a of state.affixes) {
    const w = state.sel === "__auto__" ? null : weightFor(a.name, state.builds[state.sel]);
    const { roll, base } = rollOf(a);
    const div = document.createElement("div");
    div.className = "row" + (a.include ? "" : " off") + (base ? " base" : "");
    const tags = (a.converted ? '<span class="tag">转</span>' : "") +
                 (a.recommended ? '<span class="tag rec">荐</span>' : "") +
                 (a.dingyin ? '<span class="tag dy">定音</span>' : "") +
                 (a.known ? "" : '<span class="tag" style="background:#f1f3f5;color:#868e96">未识别</span>');
    const weightTxt = base ? "基础属性·已排除"
      : (roll === null ? (a.include ? "缺满值" : "") : Math.round(roll) + "%");
    div.innerHTML =
      `<input type="checkbox" ${a.include ? "checked" : ""}>` +
      `<div class="nm">${tags}${a.name}` +
        `<div class="roll">${weightTxt}${w === null ? "" : " · 权重" + w}</div></div>` +
      `<div><input type="number" step="0.1" value="${a.value}"><span class="unit">${a.unit === "percent" ? "%" : ""}</span></div>` +
      `<button class="del" title="删除">✕</button>`;
    const [chk, , valBox, del] = div.children;
    const numIn = valBox.querySelector("input");
    chk.onchange = () => { a.include = chk.checked; render(); };
    numIn.oninput = () => { const v = parseFloat(numIn.value); if (!isNaN(v)) { a.value = v; refreshScoreOnly(); } };
    del.onclick = () => { state.affixes = state.affixes.filter(x => x !== a); render(); };
    rows.appendChild(div);
  }
  refreshScoreOnly();
}
function refreshScoreOnly() {
  if (state.sel === "__auto__") {
    let lines = [];
    for (const name in state.builds) {
      const s = computeFor(state.builds[name]);
      if (s !== null) lines.push([name, s]);
    }
    lines.sort((x, y) => y[1] - x[1]);
    if (lines.length) {
      const g = gradeOf(lines[0][1]);
      $("scoreNum").textContent = lines[0][1].toFixed(1);
      $("grade").textContent = `${g.g} · 最适配：${lines[0][0]}`;
      $("grade").className = "grade " + g.cls;
      $("others").innerHTML = "全部流派：" + lines.map(l => `${l[0]} <b>${l[1]}</b>`).join("　");
    } else { $("scoreNum").textContent = "—"; $("grade").textContent = "无法计算"; }
  } else {
    const s = computeFor(state.builds[state.sel]);
    const g = gradeOf(s);
    $("scoreNum").textContent = s === null ? "—" : s.toFixed(1);
    $("grade").textContent = g.g;
    $("grade").className = "grade " + g.cls;
    $("others").textContent = "";
  }
}
function renderChips() {
  const c = $("chips"); c.innerHTML = "";
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.className = "chip" + (state.sel === key ? " on" : "");
    b.textContent = label;
    b.onclick = () => { state.sel = key; renderChips(); render(); };
    c.appendChild(b);
  };
  mk("__auto__", "🎯 自动对比");
  for (const name of Object.keys(state.builds)) mk(name, name);
}
async function analyze(file) {
  const fd = new FormData(); fd.append("image", file);
  $("pick").innerHTML = '<span class="spin"></span> 正在本机识别…（约几秒）';
  try {
    const r = await fetch("/api/analyze", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "识别失败");
    const p = d.piece;
    $("pName").textContent = p.name || "（未识别装备名）";
    $("pTier").textContent = p.tier || "";
    $("pSet").textContent = p.set_name || "";
    $("pCraft").textContent = p.craft_score ? "造诣 " + p.craft_score : "";
    state.maxTable = d.max_table;
    state.builds = d.builds;
    state.affixes = d.affixes.map(a => ({ ...a, include: true }));
    if (!state.affixes.length) toast("没识别出词条，换个角度/亮度再拍一张试试");
    renderChips(); render();
  } catch (e) {
    toast(e.message.includes("Failed to fetch") ? "服务未启动，请先运行 python -m yanyun_gradecalc.web" : e.message, 4000);
  } finally {
    $("pick").innerHTML = '📷 选择 / 拍摄装备照片<input type="file" id="file" accept="image/*" capture="environment">';
    bindFile();
  }
}
let _fileBound = false;
function bindFile() {
  const f = $("file");
  if (!f || _fileBound) return;
  _fileBound = true;
  f.onchange = () => { if (f.files[0]) analyze(f.files[0]); f.value = ""; };
}
bindFile();
$("addRow").onclick = () => {
  state.affixes.push({ name: "自定义词条", raw_name: "", value: 0, unit: "percent",
                       converted: false, recommended: false, dingyin: false, known: false, include: true });
  render();
};

/* ================= Tab 2：整套毕业率（网站引擎） ================= */
async function loadEngineMeta() {
  if (state.engine) { fillFlow(); return; }
  try {
    const r = await fetch("/api/engine");
    const d = await r.json();
    if (!d.available) throw new Error(d.error || "引擎不可用");
    state.engine = d;
    const sel = $("flowSel");
    sel.innerHTML = "";
    for (const f of d.flowNames) {
      const o = document.createElement("option");
      o.value = f; o.textContent = f;
      const rot = (d.classRotationStats || {})[f];
      if (rot) o.textContent += `（${rot.version || ""}）`;
      sel.appendChild(o);
    }
    sel.onchange = () => { state.flow = sel.value; applyXinfaDefaults(); };
    state.flow = sel.value || "";
    renderSetOptions();
    applyXinfaDefaults();
  } catch (e) {
    toast("引擎不可用：" + e.message + "（需要安装 Node.js 并在仓库根目录运行）", 5000);
  }
}
function applyXinfaDefaults() {
  // 心法槽位规则完全来自站点：meta.xinfa[flow] = {default:[4], choices:[每槽候选，空=锁定]}
  const rule = (state.engine.xinfa || {})[state.flow] || { default: ["", "", "", ""], choices: [[], [], [], []] };
  state.xinfa = [...rule.default];
  const box = $("xinfaSlots"); box.innerHTML = "";
  rule.default.forEach((name, i) => {
    const cands = [...new Set(rule.choices[i] || [])];  // 去重
    const locked = cands.length === 0;
    const row = document.createElement("div");
    row.className = "frow";
    row.style.margin = "0";
    if (locked) {
      row.innerHTML = `<label>槽${i + 1}（固定）</label><div class="f" style="padding:7px 10px;background:#f1f3f6;border-radius:8px">${name || "—"}</div>`;
      box.appendChild(row);
    } else {
      const opts = cands.map(c => `<option value="${c}" ${c === name ? "selected" : ""}>${c}</option>`).join("");
      row.innerHTML = `<label>槽${i + 1}</label><select class="f">${opts}</select>`;
      const sel = row.querySelector("select");
      sel.onchange = () => { state.xinfa[i] = sel.value; };
      box.appendChild(row);
    }
  });
}

function renderSetOptions() {
  const sel = $("setName"); sel.innerHTML = "";
  const empty = document.createElement("option");
  empty.value = ""; empty.textContent = "（不指定套装）";
  sel.appendChild(empty);
  for (const nm of state.engine.setNames || []) {
    const o = document.createElement("option");
    o.value = nm; o.textContent = nm;
    const bonus = (state.engine.setData || {})[nm];
    if (bonus && Object.keys(bonus).length)
      o.textContent += `（主词条 ${Object.entries(bonus).map(([k, v]) => k + "+" + v).join("、")}）`;
    sel.appendChild(o);
  }
  sel.onchange = () => {};
}
function buildSlotGrid() {
  const g = $("slotGrid"); g.innerHTML = "";
  for (const key in SLOT_LABELS) {
    const card = document.createElement("div");
    card.className = "slot"; card.id = "slot-" + key;
    card.innerHTML = `<h3><span>${SLOT_LABELS[key]}</span><span class="dim" id="sl-info-${key}">未识别</span></h3>` +
      `<label class="upload small" id="sl-up-${key}">📷 拍摄/选择<input type="file" accept="image/*" capture="environment"></label>` +
      `<div id="sl-body-${key}"></div>`;
    g.appendChild(card);
    const inp = card.querySelector("input");
    inp.onchange = () => { if (inp.files[0]) analyzeSlot(key, inp.files[0]); inp.value = ""; };
  }
}
async function analyzeSlot(key, file) {
  const up = $("sl-up-" + key);
  up.innerHTML = '<span class="spin"></span> 识别中…';
  try {
    const fd = new FormData(); fd.append("image", file);
    const r = await fetch("/api/analyze", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "识别失败");
    const rows = [...d.base_stats.map(b => ({ ...b, isBase: true })),
                  ...d.affixes.map(a => ({ ...a, isBase: false }))];
    rows.forEach(r => { r.uid = newUid(); r.include = true; });
    state.slots[key] = { piece: d.piece, rows, mainUid: pickMainUid(key, rows) };
    $("sl-info-" + key).textContent = `${d.piece.name || ""} ${d.piece.craft_score ? "造诣" + d.piece.craft_score : ""}`;
    renderSlot(key);
  } catch (e) {
    toast(key + " 识别失败：" + e.message);
  } finally {
    up.innerHTML = "📷 重拍/重选";
  }
}
function pickMainUid(key, rows) {
  const armor = ["head", "chest", "legs", "hands"].includes(key);
  const prefer = armor ? ["气血最大值"] : ["最大外功攻击", "最大鸣金攻击"];
  for (const nm of prefer) {
    const hit = rows.find(r => r.name === nm);
    if (hit) return hit.uid;
  }
  return rows.length ? rows[0].uid : null;
}
function renderSlot(key) {
  const s = state.slots[key];
  if (!s) return;
  const body = $("sl-body-" + key);
  body.innerHTML = "";
  // 主词条选择
  const mainRow = document.createElement("div");
  mainRow.className = "frow";
  const opts = s.rows.map(r => `<option value="${r.uid}" ${r.uid === s.mainUid ? "selected" : ""}>${r.name} ${r.value}${r.unit === "percent" ? "%" : ""}</option>`).join("");
  mainRow.innerHTML = `<label>主词条</label><select class="f">${opts || "<option>（无候选）</option>"}</select>`;
  const sel = mainRow.querySelector("select");
  sel.onchange = () => { s.mainUid = sel.value || null; renderSlot(key); };
  body.appendChild(mainRow);
  // 副词条行（排除主词条）
  for (const r of s.rows) {
    if (r.uid === s.mainUid) continue;
    const div = document.createElement("div");
    div.className = "sub" + (r.include ? "" : " off");
    div.innerHTML =
      `<input type="checkbox" ${r.include ? "checked" : ""}>` +
      `<div class="nm">${r.name}</div>` +
      `<div style="display:flex"><input type="number" step="0.1" value="${r.value}"><span class="unit">${r.unit === "percent" ? "%" : ""}</span></div>` +
      `<button class="del">✕</button>`;
    const [chk, , valBox, del] = div.children;
    const numIn = valBox.querySelector("input");
    chk.onchange = () => { r.include = chk.checked; renderSlot(key); };
    numIn.oninput = () => { const v = parseFloat(numIn.value); if (!isNaN(v)) r.value = v; };
    del.onclick = () => { s.rows = s.rows.filter(x => x !== r); if (s.mainUid === r.uid) s.mainUid = null; renderSlot(key); };
    body.appendChild(div);
  }
}
$("calcBtn").onclick = async () => {
  const equipped = {};
  for (const key in state.slots) {
    const s = state.slots[key];
    if (!s) continue;
    const main = s.rows.find(r => r.uid === s.mainUid);
    if (!main) { toast(`${SLOT_LABELS[key]} 未选择主词条，已跳过`); continue; }
    equipped[key] = {
      mainStat: { type: main.name, value: main.value, isPercent: main.unit === "percent" },
      subStats: s.rows.filter(r => r.include && r.uid !== s.mainUid)
        .map(r => ({ type: r.name, value: r.value, isPercent: r.unit === "percent" })),
    };
  }
  if (!Object.keys(equipped).length) { toast("还没有识别任何装备"); return; }
  const btn = $("calcBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 引擎计算中…';
  $("gradErr").textContent = "";
  try {
    const r = await fetch("/api/gradrate", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        className: state.flow, bow: $("bowSel").value, armory: $("armorySel").value,
        setName: $("setName").value, xinfa: state.xinfa.slice(0, 4),
        equippedItems: equipped,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "计算失败");
    $("gradOut").style.display = "";
    const rate = parseFloat(d.graduationRate);
    $("gradNum").textContent = isNaN(rate) ? "—" : rate.toFixed(2) + "%";
    const g = rate >= 90 ? { g: "毕业", cls: "g3" } : rate >= 70 ? { g: "成长中", cls: "" } : { g: "还需打造", cls: "g1" };
    $("gradGrade").textContent = g.g;
    $("gradGrade").className = "grade " + g.cls;
    $("gradDps").innerHTML = `<span>DPS <b>${Math.round(d.dps || 0).toLocaleString()}</b></span>` +
      `<span>总伤 <b>${Math.round(d.totalDamage || 0).toLocaleString()}</b></span>`;
    const v = d.meta && d.meta.version;
    $("gradVersion").textContent = v ? `基准：${v.version || ""}（${v.updateTime || ""}）` : "";
    const panel = d.panel || {};
    $("panelTbl").innerHTML = Object.entries(panel)
      .filter(([k, v]) => typeof v === "number" && !k.startsWith("_"))
      .map(([k, v]) => `<tr><td>${k}</td><td>${Math.round(v * 1000) / 1000}</td></tr>`).join("");
  } catch (e) {
    $("gradErr").textContent = "计算失败：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "🧮 计算整套毕业率（网站同款引擎）";
  }
};
buildSlotGrid();

/* ================= 公共 ================= */
fetch("/api/config").then(r => r.json()).then(d => {
  state.builds = d.builds; state.maxTable = d.max_table; renderChips();
}).catch(() => toast("无法连接本地服务：请先运行 python -m yanyun_gradecalc.web", 5000));
</script>
</body>
