[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yanyun-gradecalc"
version = "0.1.0"
description = "燕云十六声装备毕业度计算器：拍照 OCR 识别装备词条，按流派（毕业率计算器导入）加权计算毕业度。纯本地运行"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "heee-a" }]
keywords = ["where-winds-meet", "yanyun", "ocr", "game-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "rapidocr-onnxruntime>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = ["flask>=3.0"]

[project.scripts]
ygc = "yanyun_gradecalc.cli:main"
ygc-web = "yanyun_gradecalc.web:main"

[tool.setuptools]
packages = ["yanyun_gradecalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
